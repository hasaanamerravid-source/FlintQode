name: Build FlintQode installers

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Generate icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      - name: Rust format check
        working-directory: src-tauri
        continue-on-error: true
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        # The codebase predates this gate; keep it advisory until the
        # existing warnings are cleared, so a release is never blocked by
        # a lint that does not affect correctness.
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FlintQode v__VERSION__'
          releaseBody: 'See the changelog for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
