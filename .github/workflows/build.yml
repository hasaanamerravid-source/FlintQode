name: Build FlintQode installers

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Configure optional signing secrets
        # GitHub exposes an unset secret as an empty string. Tauri treats a
        # present-but-empty APPLE_CERTIFICATE as a certificate to import, so
        # only export variables that actually have a value. See
        # docs/maintenance/platform-signing.md.
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              {
                echo "$name<<EOF_SIGNING"
                echo "$value"
                echo "EOF_SIGNING"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Generate icons
        run: npm run icons

      - name: Frontend checks
        # Format, types, translations, release manifest, unit tests and build.
        run: npm run check

      - name: Rust format check
        working-directory: src-tauri
        continue-on-error: true
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        # The codebase predates this gate; keep it advisory until the
        # existing warnings are cleared, so a release is never blocked by
        # a lint that does not affect correctness.
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host 'No Windows certificate configured; keeping the unsigned build.'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Build release installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FlintQode v__VERSION__'
          releaseBody: |
            FlintQode v1.6.0 — small path, workspace and selection tools.

            Added:
            - Copy the active file's absolute path or its path relative to the open workspace.
            - Reveal the active file in the file manager.
            - Recent workspaces in the command palette and a Reopen last workspace command.
            - Expand selection to word or line, and select all matches of the current word.
            - Two opt-in settings: save all files before Run File, and save the active file when the window loses focus. Both are off by default.

            Changed:
            - Opening a workspace records it in settings; missing folders are dropped at startup.

            Installers: Linux (.deb, .AppImage, .rpm), Windows (.exe, .msi) and macOS (.dmg).
            See CHANGELOG.md for the full release notes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
