name: Build FlintQode installers

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Optional signing secrets. Empty values leave the existing unsigned
      # build path unchanged; see docs/maintenance/platform-signing.md.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Generate icons
        run: npm run icons

      - name: Frontend checks
        # Format, types, translations, release manifest, unit tests and build.
        run: npm run check

      - name: Rust format check
        working-directory: src-tauri
        continue-on-error: true
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        # The codebase predates this gate; keep it advisory until the
        # existing warnings are cleared, so a release is never blocked by
        # a lint that does not affect correctness.
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != '' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Build release installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FlintQode v__VERSION__'
          releaseBody: |
            FlintQode v1.4.7 — a responsive update button, a quieter Problems panel and one terminal in the right folder.

            Highlights:
            - Update checks, downloads and installs now run off the UI thread with bounded timeouts and in-app confirmations; only genuinely newer versions are offered.
            - Removed the built-in "Line is longer than 120 characters" warning; other syntax and style diagnostics stay.
            - Opening the integrated terminal creates exactly one shell in the workspace folder, including after closing and reopening the panel.
            - No Java or C++ runtime was added: the existing Rust and webview stack already covers the real hot paths.
            - Includes the Extensions view, power save mode, editable code token colours and the rest of v1.4.6.

            Installers: Linux (.deb, .AppImage, .rpm), Windows (.exe, .msi) and macOS (.dmg).
            See CHANGELOG.md for the full release notes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
