[package]
name = "flintqode"
version = "1.4.0"
description = "FlintQode - a fast, native all-in-one text editor"
authors = ["FlintQode"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flintqode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
regex = "1"
rayon = "1"
encoding_rs = "0.8"
notify = "7"
portable-pty = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
